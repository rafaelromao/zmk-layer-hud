# Releases, by release-please: each push to main keeps a release pull request up to date -- the next
# version from the Conventional Commits since the last release, its CHANGELOG.md entry, version.txt
# and the tablets' app versions (release-please-config.json). Merging that pull request tags vX.Y.Z
# and makes the GitHub release, which install.sh and `update` take; the Android keyboard's APK is then
# built from the tag and attached to it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android-apk:
    name: Android keyboard's APK
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
      # Signed with the project's release key, the same for every release, so each installs over the
      # one before (Android takes an update only from the key that signed what is installed). A run's
      # own debug key would differ every time. No key in the secrets, no APK: docs/development.md.
      - name: the release key, from the repository's secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::no release key: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to the repository's secrets (docs/development.md), then run this job again"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: the app, built from the tag and signed
        working-directory: apps/android
        env:
          ZMKHUD_KEYSTORE: ${{ runner.temp }}/release.jks
          ZMKHUD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZMKHUD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZMKHUD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --console=plain :app:assembleRelease
      - name: attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk "zmk-layer-hud-${TAG}-android.apk"
          gh release upload "$TAG" "zmk-layer-hud-${TAG}-android.apk" --clobber
      - name: the key off the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
