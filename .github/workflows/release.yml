# Releases, by release-please: each push to main keeps a release pull request up to date -- the next
# version from the Conventional Commits since the last release, its CHANGELOG.md entry, version.txt
# and the tablets' app versions (release-please-config.json). Merging that pull request tags vX.Y.Z
# and makes the GitHub release, which install.sh and `update` take; the Android keyboard's APK is then
# built from the tag and attached to it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android-apk:
    name: Android keyboard's APK
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
      - name: the app, built from the tag
        working-directory: apps/android
        run: gradle --console=plain :app:assembleDebug
      # A debug build, signed with this run's debug key: for sideloading (docs/tablets.md).
      - name: attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "zmk-layer-hud-${TAG}-android.apk"
          gh release upload "$TAG" "zmk-layer-hud-${TAG}-android.apk" --clobber
