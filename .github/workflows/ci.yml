# Every platform the HUD runs on, on each push to main and each pull request: the host on macOS, on
# Linux and on Arch (Omarchy's base), the pages, the firmware module, and the tablets' keyboards.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  host:
    name: host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: the virtualenv's packages, pinned
        run: python -m pip install -r host/requirements.txt
      - run: make test-host PYTHON=python

  arch:
    name: host (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed python python-pip git make gcc
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The Linux panel runs under the system interpreter, not the virtualenv: every host module at
      # least compiles with Arch's.
      - name: the host modules, with the system Python
        run: python -m py_compile host/*.py host/linux/*.py
      - run: python -m venv /tmp/venv && /tmp/venv/bin/pip install -r host/requirements.txt
      - run: make test-host test-firmware PYTHON=/tmp/venv/bin/python

  pages:
    name: pages, site and apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r host/requirements.txt
      - run: make test-hud test-site test-apps PYTHON=python NODE=node

  firmware:
    name: firmware module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-firmware

  android:
    name: Android keyboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # No wrapper in the tree: the Gradle the project is built with, provisioned.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
      - name: the sink's tests, the app's, and the app
        working-directory: apps/android
        run: gradle --console=plain :sink:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iPad keyboard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Core's tests (JavaScriptCore, the text sink, hit-testing, pairing)
        working-directory: apps/ios/Core
        run: swift test
      - run: brew install xcodegen
      # Unsigned, for the simulator: placeholders where Local.xcconfig names a team, a bundle prefix
      # and an App Group.
      - name: the app and its keyboard, built
        working-directory: apps/ios
        run: |
          printf 'ZMKHUD_TEAM =\nZMKHUD_BUNDLE_PREFIX = io.github.rafaelromao\nZMKHUD_APP_GROUP = group.io.github.rafaelromao.zmkhud\n' > Local.xcconfig
          xcodegen generate
          xcodebuild -project ZmkHud.xcodeproj -scheme ZmkHud -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
