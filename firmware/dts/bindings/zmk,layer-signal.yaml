description: |
  Reports the keyboard's active layers to a host program over a carrier of this
  module's own: a CDC-ACM serial interface over USB, notifications on our own
  GATT service over BLE. Nothing it sends can be read by the operating system
  as a key.

  On every layer change the module sends one frame carrying a bitmap of the
  active layers. With positions, it also sends one frame per key press and
  release. The frame format is in firmware/src/signal_frame.h, which the host
  mirrors.

  Example:

    / {
        layer_signal {
            compatible = "zmk,layer-signal";
            heartbeat-ms = <2000>;
            positions;
        };
    };

  Over USB the carrier needs a UART: build with the layer-hud-usb-uart snippet,
  which adds a cdc-acm-uart and points the zmk,layer-hud-uart chosen at it.

    build ... -n layer-hud-usb-uart

  Nothing needs to be set on the keyboard report any more. Earlier versions
  required CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=12 and the HKRO report type
  because the signal shared the report with real keys; it no longer does.

compatible: "zmk,layer-signal"

properties:
  settle-ms:
    type: int
    default: 3
    description: |
      Delay between a layer change and the frame, so a group of changes (a host
      vim mode switching two layers, a layer-tap roll) becomes one frame.

  positions:
    type: boolean
    description: |
      Also send the physical position of every key press and release, so the
      HUD can light the exact key for chords, combos, macros, layer and
      modifier keys, whatever they produce.

      Safe to enable now. In the report-based version this cost two blocking
      HID sends per press on the system work queue -- the queue ZMK scans the
      matrix on -- which pushed the next press's timestamp past the combo term
      and stopped combos firing. The carriers here drop rather than block, so a
      press cannot be delayed by the signal.

  heartbeat-ms:
    type: int
    default: 0
    description: |
      When non-zero, re-send the current layer set this often, so a host that
      starts mid-session learns the state without a resync channel. 2000 is a
      good value for a HUD. 0 disables it.

      Unlike the report-based version this does not have to wait for held keys:
      that deferral existed because the old usages reached the host as key
      events and interrupted its auto-repeat.
