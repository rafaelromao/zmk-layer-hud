# zmk-layer-hud config for Romak 34 (examples/romak-34.yaml, a 3x5+2 split). Paths are relative to
# this file. The HUD draws from romak-34.definitions.json beside it, which
#   zmk-layer-hud import --config config/romak-34.yaml
# writes from `keymap:` below.
#
# Try it without a keyboard:
#   zmk-layer-hud demo --config config/romak-34.yaml --play docs/demo-romak.json

keymap: ../examples/romak-34.yaml
title: Romak 34
combo_term_ms: 30

# Pinned to Omarchy, where the demo is recorded: the right Alt is AltGr of the US-International
# layout, and ç is AltGr+, (the Linux side of the author's keymap; on a Mac it is ' then c). The
# drawing has no layer per OS, and needs none.
feed:
  altgr: 1

# The layers' names as LayerBench gives them.
layers:
  map:
    alpha1: {label: Alpha 1}
    alpha2: {label: Alpha 2}
    ç-extension: {label: Ç extension}
    numbers: {label: Numbers}
    symbols: {label: Symbols}
    nav: {label: Navigation}
    media: {label: Mouse}
    func: {label: Functions}

# alpha2 and the ç extension are one-shot layers: a key there types and the layer goes.
extras:
  sticky: [alpha2, ç-extension]
  alpha2: alpha2
