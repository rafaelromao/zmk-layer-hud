# zmk-layer-hud config for Rafael's Diamond (rafaelromao/keyboards).
# Copy to ~/.config/zmk-layer-hud/config.yaml and adjust the paths.

keymap: ~/projects/keyboards/docs/img/diagrams/keymap-drawer/keymap-drawer.yaml
drawer_config: ~/projects/keyboards/docs/img/diagrams/keymap-drawer/keymap-drawer-config.yaml
# title: Magic Romak          # default: the name of whichever keyboard is typing (Diamond, Rommana)

# Every size and timing the HUD uses (ms unless noted). Shown with the defaults; drop any line.
hud:
  width: 598                  # panel width in points; the height follows the layout
  opacity: 86                 # panel background, 0 (clear) to 100 (solid)
  press_ms: 320               # (no positions) a key stays lit this long after a press
  release_ms: 60              # a key stays lit this long after its reported release
  held_timeout_ms: 5000       # a held key is released on the HUD after this if its release report is lost
  combo_pill_ms: 1000         # a combo's pill stays up this long
  combo_slack_ms: 20          # added to combo_term_ms for the reports' travel time
  activator_ms: 400           # a key pressed this recently before a layer appeared is its activator
  positions_fresh_ms: 3000    # after a position report, characters stop lighting keys for this long
  one_shot_ms: 450            # (no positions) an inferred one-shot layer stays on the banner this long
  momentary_ms: 700           # (no positions) an inferred held layer stays this long after its last key
  sequence_ms: 200            # (no positions) keys within this may spell one multi-key legend
  sequence_max: 6             # (no positions) longest such sequence, in keys

# The reader's timings.
feed:
  dead_key_ms: 60             # dead key + letter within this = one accented character
  rescan_s: 2                 # how often to look for (re)connected keyboards

# Every ZMK board (Diamond over USB, Rommana over BLE) is read; add `name: Diamond` to pick one.
keyboard: { vid: 0x1d50, pid: 0x615e }

# The drawer YAML is a curated view (six vim layers drawn as one, copy layers folded into their
# originals), so which drawing shows which ZMK layer has to be said. The ids and the keyboard's own
# name for each come from imported.yaml; this is in the same order, and says what to draw for each.
# null = transparent or not drawn.
layers:
  map:
    ALPHA1:      { drawer: alpha1, label: Alpha 1, class: "off" }
    ALT_OS:      { drawer: null, label: Alt OS }
    VIM_NORMAL:  { drawer: vim, label: Vim normal, class: vim }
    VIM_VISUAL:  { drawer: vim, label: Vim visual, class: vim }
    VIM_CHANGE:  { drawer: vim, label: Vim change, class: vim }
    VIM_INSERT:  { drawer: null, label: Vim insert, class: vim-insert }
    VIM_REPLACE: { drawer: vim, label: Vim replace, class: vim }
    VIM_CMDLINE: { drawer: null, label: Vim cmdline, class: vim-cmdline }
    CASE_A1:     { drawer: shifted1, label: Caps word }
    CPLK_A1:     { drawer: shifted1, label: Caps line }
    SHORTS:      { drawer: shortcuts, label: Shortcuts }
    TOGS:        { drawer: toggles, label: Toggles }
    MEHS:        { drawer: mehs, label: Mehs }
    ALPHA2:      { drawer: alpha2, label: Alpha 2 }
    NUM:         { drawer: numbers, label: Numbers }
    SYM:         { drawer: symbols, label: Symbols }
    SEN_CASE:    { drawer: shifted1, label: Sentence case }
    CCEDIL:      { drawer: ç-extension, label: Ç extension }
    SFT_A2:      { drawer: shifted2, label: Shift · Alpha 2 }
    CASE_A2:     { drawer: shifted2, label: Caps · Alpha 2 }
    CASE_CCEDIL: { drawer: ç-extension, label: Caps · Ç }
    ALTREP2:     { drawer: null, label: Alt repeat }
    NAV:         { drawer: nav, label: Navigation }
    NUM_CP:      { drawer: numbers, label: Numbers }
    SYM_CP:      { drawer: symbols, label: Symbols }
    MEDIA:       { drawer: media, label: Media / mouse }
    NAV_CP:      { drawer: nav, label: Navigation }
    TEXT:        { drawer: text, label: Text navigation }
    FUN:         { drawer: func, label: Function keys }
    MACROS:      { drawer: macros, label: Macros }

base: alpha1

# The Diamond's 24 drawer keys in ZMK's 36-position matrix (config.dtsi), so the firmware's
# key-position announcements (`positions;` in the node) light the right key. Rows top to
# bottom, left hand then right hand, thumbs last.
positions: [1, 2, 3, 6, 7, 8, 10, 11, 12, 13, 16, 17, 18, 19, 21, 22, 23, 26, 27, 28, 31, 32, 33, 34]

# The keyboard's combo timeout — key positions pressed within it are one chord — comes from the
# keymap too, so it cannot drift from the firmware. Set `combo_term_ms:` here to override it.

# Which layers each combo really fires on lives in diamond.imported.yaml beside this file, taken
# out of the keyboard's own keymap by `zmk-layer-hud import`, kept current by `zmk-layer-hud sync`.
# A combo's `layers:` in the drawer file is a drawing choice — draw it once, on the diagram that
# explains it — where the HUD needs the firmware's gate, and without the gate it would have to
# guess: 💾 really does save on every layer, and the digits really do not.
#
# Anything written here wins over what was imported, for a combo the import gets wrong. Name it by
# its key positions, in any order, and by `tap:` as well when several combos share them. An entry
# matching nothing is an error rather than a no-op, so these go stale loudly.
# combos:
#   - positions: [11, 12, 22]
#     tap: "↵"
#     layers: [alpha1, vim]

# Inference hints, used only for a key the keyboard's live stack cannot explain (synthesized
# keys in a rehearsal, legends the drawer spells differently).
extras:
  sticky: [alpha2, shifted1, shifted2, ç-extension]
  alpha2: alpha2
  letter_combos_on: [vim]
  search: [alpha2, shifted1, shifted2, numbers, symbols, nav, shortcuts, media, text, func, macros, toggles, ç-extension]
