# zmk-layer-hud config for keymap-drawer's 3x5 example (examples/3x5.yaml, a 3x5+3 split).
# Paths are relative to this file.
#
# Try it without a keyboard:
#   .venv/bin/python3 host/keymap.py --config config/example-3x5.yaml --dump > hud/keymap.json
#   python3 -m http.server -d hud 8765       # open http://localhost:8765/index.html?keymap=keymap.json
#   in the browser console: hud.setLayers([1]); hud.pressAt(13)
# or run the panel against it: ZMKHUD_CONFIG=config/example-3x5.yaml host/macos/start.sh
#
# The YAML lists layers and keys in the keymap's order, so no `layers:` or `positions:` map is
# needed; everything else is optional (see config/diamond.yaml for the full list).

keymap: ../examples/3x5.yaml
title: 3x5 example
