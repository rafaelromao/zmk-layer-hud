# zmk-layer-hud config for any ZMK keyboard whose keymap-drawer YAML came from
#   keymap parse -z my.keymap > my-keymap.yaml
# There the YAML layer order is the ZMK layer order, so nothing else is needed:
# layer id n is the n-th layer of the file.
#
# Copy to ~/.config/zmk-layer-hud/config.yaml.

keymap: ~/path/to/my-keymap.yaml

# Optional: the keymap-drawer config you draw with (key sizes, glyphs).
# drawer_config: ~/path/to/keymap-drawer-config.yaml

# Optional: a 3x5 split whose layout only counts its keys ("33333+3 3+33333", or an ortho_layout
# of 3 rows and 5 columns) is drawn with a Ferris Sweep's column stagger; this keeps it ortholinear.
# stagger: false

# Optional: pick one keyboard when several ZMK boards are connected (substring of the product name).
# keyboard: { vid: 0x1d50, pid: 0x615e, name: Corne }

# Optional: name the keyboard's CDC-ACM port yourself, when a board exposes several and probing
# each one in turn is too slow, or when it does not carry ZMK's vid/pid.
# serial: { port: /dev/cu.usbmodem1101, probe_s: 8 }

# Optional: BLE. `address` is needed wherever a connected keyboard no longer advertises — a
# CoreBluetooth peripheral UUID on macOS, a MAC address on Linux. The keyboard must be bonded to
# this host: the characteristic requires encryption.
# ble: { address: null, enabled: true }

# Optional: refine what the banner shows per layer id or name.
# layers:
#   map:
#     3: { label: Navigation }
#     4: { drawer: null, label: Adjust }     # a layer the YAML does not draw

# Optional: the keymap's combo timeout (ZMK timeout-ms), so simultaneous presses form a combo,
# and how long the keyboard must be idle before one (the combos' require-prior-idle-ms): a chord
# struck sooner after another key is typed as its keys. `import` reads both from the keymap.
# combo_term_ms: 50
# combo_idle_ms: 150

# Optional: every size and timing the HUD and the reader use; see config/diamond.yaml for the
# full list with defaults.
# hud: { width: 700, press_ms: 320 }
# feed: { dead_key_ms: 60 }

# Optional: the stats bar's chips (see config/diamond.yaml for all of them), and the finger that
# strikes each key when the HUD cannot tell from a split board's columns.
# stats: { sfb: true, slow: true, layer: false }
# fingers: [lp, lr, lm, li, li, ri, ri, rm, rr, rp, ...]

# Optional: layers entered for one key (sticky-key style), shown as one-shot while inferring.
# extras:
#   sticky: [Sym]
