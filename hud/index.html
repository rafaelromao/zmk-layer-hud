<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ZMK layer HUD</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div id="frame">
<div id="hud">
  <div id="layer"><span id="layerName"></span><span id="layerSub"></span><button id="fit" title="back to the keyboard's own size" aria-label="back to the keyboard's own size" aria-pressed="false"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 8 L8 2 M5 2 H8 V5 M2 5 V8 H5"/></svg></button><button id="side"title="hide the stats" aria-label="hide the stats" aria-pressed="true"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M6.5 2 L3.5 5 L6.5 8"/></svg></button><button id="hide" title="hide the HUD: it keeps counting, and its icon or `zmk-layer-hud show` brings it back" aria-label="hide"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 5 H7.5"/></svg></button><button id="close" title="close the HUD" aria-label="close">✕</button></div>
  <div id="board"></div>
  <div id="status"><span id="feed">waiting for the keymap…</span><span id="title"></span></div>
</div>
<div id="stats"><a id="statsHead" href="https://rafaelromao.github.io/zmk-layer-hud/" target="_blank" rel="noopener" title="the landing page, in a browser">ZMK Layer HUD</a></div>
<div id="grip" title="drag to resize the HUD"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 5.5 L5.5 12.5 M12.5 9.5 L9.5 12.5"/></svg></div>
</div>
<div id="keys"></div>
<script src="keynames.js"></script>
<script src="keys.js"></script>
<script src="view.js"></script>
<script src="keystrokes.js"></script>
<script src="hud.js"></script>
</body>
</html>
